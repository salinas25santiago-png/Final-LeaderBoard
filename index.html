<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0039a6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <h1>Leaderboard</h1>
      <div class="acciones">
        <button id="reiniciar-grande" class="btn-enfocar btn-reiniciar-grande" type="button">↺ Reiniciar</button>
        <button id="enfocar" class="btn-enfocar" type="button">⛶ Ampliar</button>
        <button id="finalizar" class="btn-enfocar btn-finalizar" type="button">🏁 Finalizar</button>
      </div>
    </header>

    <ol id="leaderboard" class="leaderboard"></ol>

    <div id="banca" class="banca-slot"></div>

    <button id="reiniciar" class="reiniciar" type="button">Reiniciar</button>
  </main>

  <!-- Controles de la esquina: pantalla completa + selector de grupo -->
  <div id="selector" class="selector">
    <div id="menu-grupo" class="menu-grupo">
      <button type="button" data-grupo="1" style="--i:2">1</button>
      <button type="button" data-grupo="2" style="--i:1">2</button>
      <button type="button" data-grupo="3" style="--i:0">3</button>
    </div>
    <div class="controles">
      <button id="btn-pantalla" class="btn-pantalla" type="button" aria-label="Pantalla completa" title="Pantalla completa">
        <svg class="ico-entrar" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="ico-salir" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
      <button id="btn-grupo" class="btn-grupo" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Cambiar de grupo">
        <b id="num-grupo">2</b>
      </button>
    </div>
  </div>

  <!-- Animación al cambiar de grupo -->
  <div id="transicion" class="transicion" aria-hidden="true">
    <div class="cortina izq"></div>
    <div class="cortina der"></div>
    <div class="t-linea"></div>
    <div class="t-anillo"></div>
    <div class="t-centro"><b id="t-numero">2</b></div>
  </div>

  <!-- Pantalla final / podio -->
  <section id="final" class="final" aria-hidden="true">
    <div class="rayos"></div>
    <canvas id="confeti"></canvas>
    <div id="cuenta" class="cuenta"></div>
    <div id="destello" class="destello"></div>

    <div id="final-contenido" class="final-contenido">
      <div class="final-titulo">
        <h2>Podio</h2>
      </div>

      <div id="podio" class="podio"></div>
      <div id="resto" class="resto"></div>

      <div class="final-acciones">
        <button id="volver" class="btn-enfocar" type="button">← Volver al marcador</button>
        <button id="nueva" class="btn-enfocar btn-primario" type="button">↺ Nueva carrera</button>
      </div>
    </div>

<!-- Corazón que se parte (solo cuando gana Ignorance) -->
<div id="corazon" class="corazon-roto" aria-hidden="true">
  <i class="c-onda"></i>

  <svg class="c-svg" viewBox="0 0 200 180">
    <defs>
      <linearGradient id="cor-g" x1="0.15" y1="0" x2="0.85" y2="1">
        <stop offset="0" stop-color="#c93a56"/>
        <stop offset=".5" stop-color="#8e1432"/>
        <stop offset="1" stop-color="#4d0818"/>
      </linearGradient>
      <clipPath id="cor-izq">
        <polygon points="-40,-40 100,-40 100,32 92,52 108,72 90,96 106,118 94,140 100,170 100,220 -40,220"/>
      </clipPath>
      <clipPath id="cor-der">
        <polygon points="240,-40 100,-40 100,32 92,52 108,72 90,96 106,118 94,140 100,170 100,220 240,220"/>
      </clipPath>

      <!-- Dibujo de cada mitad (se reutiliza para la estela) -->
      <g id="dibujo-izq">
        <g clip-path="url(#cor-izq)">
          <path d="M100 170 C20 110 0 70 0 45 C0 18 20 0 48 0 C70 0 90 12 100 32 C110 12 130 0 152 0 C180 0 200 18 200 45 C200 70 180 110 100 170 Z"
                fill="url(#cor-g)" stroke="#2a0410" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="46" cy="32" rx="20" ry="11" fill="#fff" opacity=".22" transform="rotate(-28 46 32)"/>
        </g>
      </g>
      <g id="dibujo-der">
        <g clip-path="url(#cor-der)">
          <path d="M100 170 C20 110 0 70 0 45 C0 18 20 0 48 0 C70 0 90 12 100 32 C110 12 130 0 152 0 C180 0 200 18 200 45 C200 70 180 110 100 170 Z"
                fill="url(#cor-g)" stroke="#2a0410" stroke-width="3" stroke-linejoin="round"/>
        </g>
      </g>
    </defs>

    <!-- Estela (copias translúcidas que se quedan atrás) -->
    <g class="c-mitad c-izq fantasma f3"><use href="#dibujo-izq"/></g>
    <g class="c-mitad c-der fantasma f3"><use href="#dibujo-der"/></g>
    <g class="c-mitad c-izq fantasma f2"><use href="#dibujo-izq"/></g>
    <g class="c-mitad c-der fantasma f2"><use href="#dibujo-der"/></g>
    <g class="c-mitad c-izq fantasma f1"><use href="#dibujo-izq"/></g>
    <g class="c-mitad c-der fantasma f1"><use href="#dibujo-der"/></g>

    <!-- Las dos mitades -->
    <g class="c-mitad c-izq">
      <use href="#dibujo-izq"/>
      <polyline class="c-borde" points="100,32 92,52 108,72 90,96 106,118 94,140 100,170"/>
    </g>
    <g class="c-mitad c-der">
      <use href="#dibujo-der"/>
      <polyline class="c-borde" points="100,32 92,52 108,72 90,96 106,118 94,140 100,170"/>
    </g>

    <polyline class="c-grieta" points="100,32 92,52 108,72 90,96 106,118 94,140 100,170"/>
  </svg>

  <i class="c-luz"></i>

  <span class="trozo" style="--ox:48%;--oy:20%;--dx:-24vmin;--dy:-12vmin;--rot:-240deg;--k:1.3"></span>
  <span class="trozo" style="--ox:52%;--oy:30%;--dx:22vmin;--dy:-16vmin;--rot:200deg;--k:1"></span>
  <span class="trozo" style="--ox:47%;--oy:42%;--dx:-30vmin;--dy:6vmin;--rot:-300deg;--k:.8"></span>
  <span class="trozo" style="--ox:53%;--oy:50%;--dx:28vmin;--dy:10vmin;--rot:260deg;--k:1.2"></span>
  <span class="trozo" style="--ox:49%;--oy:58%;--dx:-16vmin;--dy:22vmin;--rot:-180deg;--k:.9"></span>
  <span class="trozo" style="--ox:51%;--oy:66%;--dx:18vmin;--dy:26vmin;--rot:220deg;--k:1.1"></span>
  <span class="trozo" style="--ox:50%;--oy:75%;--dx:-8vmin;--dy:30vmin;--rot:-120deg;--k:.7"></span>
  <span class="trozo" style="--ox:50%;--oy:24%;--dx:6vmin;--dy:-26vmin;--rot:160deg;--k:.8"></span>
  <span class="trozo" style="--ox:46%;--oy:36%;--dx:-34vmin;--dy:-4vmin;--rot:-280deg;--k:.7"></span>
  <span class="trozo" style="--ox:54%;--oy:38%;--dx:34vmin;--dy:-2vmin;--rot:300deg;--k:.9"></span>
  <span class="trozo" style="--ox:48%;--oy:82%;--dx:-12vmin;--dy:34vmin;--rot:-200deg;--k:1"></span>
  <span class="trozo" style="--ox:52%;--oy:80%;--dx:14vmin;--dy:32vmin;--rot:240deg;--k:.8"></span>
</div>

    <button id="saltar" class="btn-enfocar saltar" type="button">Saltar ›</button>
  </section>

  <div id="efectos"></div>
  <script src="script.js"></script>
</body>
</html>
